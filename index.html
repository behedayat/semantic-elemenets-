<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Elements</title>
  <link rel="icon" href="images/car1.jpg">
  <style>
    body{
      margin:auto
    }

    header , nav,main,section,article,aside,footer{
      padding:20px;
      margin :10px 0 ;
      border: 1px solid black
    }
    header{
      color:#F3E6D5;
      background-color: #800020;
      text-align: center;
    }
    nav{
      background-color:#F3E6D5;
      text-align: center;
    }
    nav a{
color:rgb(232, 8, 8);
text-decoration: none;
margin:0 15px;
font-size: 20px;
    }
main{
  display:flex;
  flex-wrap:wrap;
  gap:25px
}
.article{
  width: 100%;
  background-color:  rgb(228, 5, 157); 
  color:white;
  text-align:center
}
.section{
  flex:3;
  background-color: antiquewhite;
}
aside{
  flex:1;
    background-color: antiquewhite;
}
footer{
   background-color: rgb(163, 98, 1);
   color:white
}
img{
  max-width: 100%;
  display: block;
  margin: auto;
}
figcaption{
  text-align: center;

}
.wi{
  width: 100%;
}
h5{
  margin:0
}
  </style>
</head>
<body>
   <nav>
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>
<header>
  <h1>Semnatic element </h1>
    <h3 >Our classes</h3>
</header>

<main>

    <div class="article">
    <h1>Website</h1>
    <p>my website is the best </p>
  </div>
  
  <section class="section">

    <section><H5 style="font-size:70px">HTML</H5> </section>
    <section><H5>Css</H5></section>
    <section><H5>Java Script</H5></section>
  </section>
 <section class="section">
    <h3>CSS</h3>
    <p>Css is a style sheet </p>
  </section>
  <aside>
    <h3>
      related content 
    </h3>
  </aside>
 
<figure class="wi">
  <img src="images/car1.jpg" alt="">
  <figcaption>This is my new car brand </figcaption>
</figure>
</main>

<footer>
<h2>Footer </h2>
</footer>

</html>
